name: Distribution tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install dist/*.whl pytest
      - run: python -m pip check
      - run: python -I scripts/test_installed.py --sdist dist/*.tar.gz --module ov_scranpool --distribution py-scranpool-omicverse
      - run: python -m pip install "git+https://github.com/sfortma2/scranPY.git@62292a039158fce0123bdec9a5e6b73ecf5db123"
      - run: python -I scripts/test_coexistence.py --wheel dist/*.whl --distribution py-scranpool-omicverse --module ov_scranpool --upstream-distribution scranPY --upstream-module scranPY
